{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Delete Task | Task Management System</title>

    <link
        rel="stylesheet"
        href="{% static 'css/create_task.css' %}"
    >

</head>

<body>

    <div class="task-container">

        <div class="task-card">

            <h1 class="task-title">
                Delete Task
            </h1>

            <p>
                Are you sure you want to delete this task?
            </p>

            <p>
                <strong>{{ task.title }}</strong>
            </p>

            <form method="POST">

                {% csrf_token %}

                <button
                    type="submit"
                    class="delete-button"
                >
                    Delete
                </button>

                <a
                    href="{% url 'dashboard' %}"
                    class="back-link"
                >
                    Cancel
                </a>

            </form>

        </div>

    </div>

</body>

</html>
