{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Task | Task Management System</title>

    <link rel="stylesheet" href="{% static 'css/create_task.css' %}">

</head>

<body>

    <div class="task-container">

        <div class="task-card">

            <h1 class="task-title">
                Edit Task
            </h1>

            <form method="POST">

                {% csrf_token %}

                <div class="form-group">

                    <label for="title">
                        Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        value="{{ task.title }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        required
                    >{{ task.description }}</textarea>

                </div>


                <div class="form-group">

                    <label for="status">
                        Status
                    </label>

                    <select id="status" name="status">

                        <option value="Pending"
                            {% if task.status == "Pending" %}selected{% endif %}>
                            Pending
                        </option>

                        <option value="Completed"
                            {% if task.status == "Completed" %}selected{% endif %}>
                            Completed
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="priority">
                        Priority
                    </label>

                    <select id="priority" name="priority">

                        <option value="Low"
                            {% if task.priority == "Low" %}selected{% endif %}>
                            Low
                        </option>

                        <option value="Medium"
                            {% if task.priority == "Medium" %}selected{% endif %}>
                            Medium
                        </option>

                        <option value="High"
                            {% if task.priority == "High" %}selected{% endif %}>
                            High
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="due_date">
                        Due Date
                    </label>

                    <input
                        type="date"
                        id="due_date"
                        name="due_date"
                        value="{{ task.due_date|date:'Y-m-d' }}"
                    >

                </div>


                <button
                    type="submit"
                    class="create-button"
                >
                    Update Task
                </button>

            </form>


            <a
                href="{% url 'dashboard' %}"
                class="back-link"
            >
                ← Back to Dashboard
            </a>

        </div>

    </div>

</body>

</html>
